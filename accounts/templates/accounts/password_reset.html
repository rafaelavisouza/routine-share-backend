{% extends "accounts/base.html" %}

{% block top_action %}
  <span class="me-2 text-white-50">Lembrou sua senha?</span>
  <a class="btn btn-sm btn-light" href="{% url 'login' %}">Entrar</a>
{% endblock %}

{% block content %}
<div class="center-wrapper">
  <h2 class="text-center mt-4">Recuperar Senha</h2>
  <p class="text-center text-muted">
    Informe seu e-mail para receber instruções de recuperação de senha.
  </p>

  <div class="card card-soft p-4 mt-4">
    <!--
      Por enquanto é só a tela (curso iniciante/intermediário).
      Depois a gente pode integrar com o reset de senha real do Django.
    -->
    <form method="post">
      {% csrf_token %}

      <label class="form-label">Seu e-mail</label>
      <div class="input-icon mb-3">
        <span>📧</span>

        <!--
          Eu não uso "form-control" aqui porque o Bootstrap muda borda/padding
          e aí fica diferente do mock.
        -->
        <input
          type="email"
          name="email"
          placeholder="Seu e-mail"
          autocomplete="email"
        />
      </div>

      <button class="btn btn-main w-100 text-white mt-2" type="submit">Enviar</button>

      <div class="text-center mt-3 text-muted">
        Lembrou sua senha?
        <a href="{% url 'login' %}">Entrar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
