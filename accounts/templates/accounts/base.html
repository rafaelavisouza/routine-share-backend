{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotina Diária</title>

  <!-- Bootstrap via CDN (mais fácil pra iniciante) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    
    /* Eu deixei o fundo bem parecido com o mock */
    body {
      background: #f3f5fb;
      font-family: Arial, sans-serif;
    }

    .topbar {
      background: linear-gradient(90deg, #0b2d59, #1d5aa6);
      height: 64px;
      display: flex;
      align-items: center;
      color: white;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff33;
      display: inline-block;
    }

    .card-soft {
      border: 0;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .btn-main {
      background: linear-gradient(180deg, #1d6bd6, #0b4ea3);
      border: 0;
      padding: 12px 18px;
      font-weight: 600;
      border-radius: 6px;
    }

    .input-icon {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f3f7;
      border: 1px solid #dde2ea;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .input-icon input {
  border: 0 !important;
  outline: none !important;
  background: transparent !important;
  width: 100%;
  padding: 0 !important;
  box-shadow: none !important;
}
/* Eu deixei o placeholder mais clarinho, igual do mock */
     .input-icon input::placeholder {
   color: rgba(0,0,0,.35);
}
    .center-wrapper {
      max-width: 520px;
      margin: 60px auto;
    }
    /* Eu dei um espacinho pros links do menu ficarem com cara de navbar */
.topbar a:hover { opacity: .85; }
/* =========================
   Gráfico de linha (bem parecido com o mock)
   ========================= */

.stats-chart {
  width: 100%;
  height: 230px;
  position: relative;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #eef2f7;
}

/* Grid (linhas bem leves) */
.stats-chart::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    /* linhas horizontais */
    linear-gradient(to bottom, rgba(13, 50, 114, 0.08) 1px, transparent 1px) 0 0 / 100% 44px,
    /* linhas verticais */
    linear-gradient(to right, rgba(13, 50, 114, 0.06) 1px, transparent 1px) 0 0 / 14.285% 100%;
  pointer-events: none;
}

/* Área do SVG */
.stats-chart .svg-wrap {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 14px;
  bottom: 42px; /* reserva espaço pros dias */
}

/* Labels dos dias */
.stats-labels {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #6c757d;
}

/* Estilo do ponto igual ao mock: círculo branco + bolinha azul */
.stats-dot-outer {
  fill: #ffffff;
  stroke: rgba(11, 78, 163, 0.12);
  stroke-width: 2;
}

.stats-dot-inner {
  fill: #0b4ea3;
}

/* Linha mais grossinha */
.stats-line {
  stroke: #0b4ea3;
  stroke-width: 3;
  fill: none;
}

/* Área preenchida bem suave */
.stats-area {
  fill: rgba(11, 78, 163, 0.10);
}
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container d-flex justify-content-between">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Rotina Diária</span>
      </div>

      <div>
        {% if user.is_authenticated %}
  <!-- Quando estiver logado, eu mostro o menu igual ao mock -->
  <nav class="d-flex align-items-center gap-4">
    <a class="text-white text-decoration-none" href="#">Home</a>
    <a class="text-white text-decoration-none fw-semibold" href="{% url 'profile' %}">Perfil</a>
    <a class="text-white text-decoration-none" href="#">Grupos</a>
    <a class="text-white text-decoration-none" href="#">Rotinas</a>
    <a class="text-white text-decoration-none" href="#">Metas</a>
    <a class="text-white text-decoration-none" href="#">Histórico</a>
    <a class="text-white text-decoration-none" href="#">Sobre</a>
  </nav>
{% else %}
  {% block top_action %}{% endblock %}
{% endif %}
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
